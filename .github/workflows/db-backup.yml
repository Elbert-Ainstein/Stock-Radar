# Supabase logical backup — PREPARED, NOT SCHEDULED (sprint 3.7).
# Inert until the SUPABASE_DB_URL secret exists; manual dispatch only.
# See docs/ops/BACKUP_PLAN_2026-07-02.md. After one good manual run +
# test restore, enable the commented schedule below.
name: DB Backup

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 7 * * *"   # daily 07:00 UTC — enable only after a test restore

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secret present
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL secret not set — see docs/ops/BACKUP_PLAN_2026-07-02.md"
            exit 1
          fi
      - name: Install postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Dump
        run: |
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --format=custom --no-owner --no-privileges \
            --file="stockradar-$(date -u +%Y%m%d-%H%M).dump"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.dump"
          retention-days: 30
